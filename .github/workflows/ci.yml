name: Jarvis quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run pytest with ResourceWarning gate
        run: |
          set +e
          python -W error::ResourceWarning -m pytest -q 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Publish Python 3.11 failure details
        if: failure() && matrix.python-version == '3.11' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.existsSync('pytest.log') ? fs.readFileSync('pytest.log', 'utf8') : 'pytest.log missing';
            const tail = raw.slice(-12000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `CI diagnostic (Python 3.11):\n\n\`\`\`text\n${tail}\n\`\`\``
            });
      - run: python scripts/verify_release.py
