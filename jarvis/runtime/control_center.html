<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS</title>
<style>
:root{color-scheme:dark;--bg:#05080b;--panel:rgba(6,12,18,.94);--line:#183343;--text:#d8edf7;--muted:#7190a0;--accent:#6ee7ff;--danger:#ff6577;--ok:#68e0a0}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px ui-monospace,SFMono-Regular,Consolas,monospace;overflow:hidden;cursor:default}#app{position:relative;width:100%;height:100%}.face{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;pointer-events:none;cursor:default}.topbar{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.brand,.state,.voicehint{background:rgba(3,8,12,.72);border:1px solid rgba(110,231,255,.18);backdrop-filter:blur(10px);padding:8px 12px;letter-spacing:.14em;text-transform:uppercase}.state{font-size:12px;color:var(--muted)}.state strong{color:var(--accent)}.voicehint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:12px;color:var(--accent);pointer-events:none;box-shadow:0 0 30px rgba(0,0,0,.35)}.dock{position:absolute;right:18px;top:50%;transform:translateY(-50%);display:grid;gap:10px}.dock button{width:52px;height:52px;border:1px solid rgba(110,231,255,.26);background:rgba(3,8,12,.82);color:var(--text);border-radius:10px;cursor:pointer;font:12px inherit;backdrop-filter:blur(12px)}.dock button:hover,.dock button.active{border-color:var(--accent);color:var(--accent)}.badge{position:absolute;right:-5px;top:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:white;font-size:10px;display:none;align-items:center;justify-content:center}.tool{position:relative}.panel{position:absolute;top:18px;right:86px;bottom:18px;width:min(560px,calc(100% - 120px));background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(18px);display:none;flex-direction:column;box-shadow:0 0 50px rgba(0,0,0,.45)}.panel.open{display:flex}.panel header{display:flex;justify-content:space-between;align-items:center;padding:15px 17px;border-bottom:1px solid var(--line)}.panel header h2{font-size:14px;margin:0;letter-spacing:.12em;text-transform:uppercase}.panel header button{background:none;color:var(--muted);border:0;font-size:20px;cursor:pointer}.body{padding:16px;overflow:auto;min-height:0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.statusdot{width:9px;height:9px;border-radius:50%;background:var(--muted)}.statusdot.running{background:var(--ok)}button.action{border:1px solid var(--line);background:#0b141a;color:var(--text);padding:8px 11px;border-radius:6px;cursor:pointer}button.action:hover{border-color:var(--accent)}button.action:disabled{opacity:.5;cursor:wait}button.danger:hover{border-color:var(--danger);color:var(--danger)}pre.log{white-space:pre-wrap;word-break:break-word;margin:0;font-size:12px;line-height:1.55;color:#a9c5d2}.entry{padding:9px 0;border-bottom:1px solid rgba(113,144,160,.12)}.entry .meta{font-size:10px;color:var(--muted);margin-bottom:3px}.entry.error{color:#ff9eaa}details.entry{padding:0;border-bottom:1px solid rgba(113,144,160,.12)}details.entry>summary{display:flex;align-items:flex-start;gap:9px;padding:9px 2px;cursor:pointer;list-style:none}details.entry>summary::-webkit-details-marker{display:none}details.entry>summary:hover{background:rgba(110,231,255,.05)}.ico{flex:0 0 18px;text-align:center;font-size:13px;line-height:1.5;filter:grayscale(.25)}.etxt{flex:1 1 auto;min-width:0}.emsg{display:block;word-break:break-word;line-height:1.45}.emeta{display:block;font-size:10px;color:var(--muted);margin-top:2px}.dot{flex:0 0 9px;width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--muted)}.dot.ok{background:var(--ok)}.dot.warn{background:#ffb85c}.dot.bad{background:var(--danger)}.dot.busy{background:var(--accent)}details.entry[open]>summary{background:rgba(110,231,255,.06)}details.entry .detail{padding:0 2px 11px 29px}.chip{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:1px 5px;margin-right:6px}.settings{display:grid;gap:13px}.settings label{display:grid;gap:5px;color:var(--muted);font-size:12px}.settings input,.settings select{width:100%;background:#071015;border:1px solid var(--line);color:var(--text);padding:9px;border-radius:5px;font:inherit}.hint{font-size:11px;color:var(--muted)}.test-result{min-height:18px;font-size:12px;color:var(--muted)}.test-result.ok{color:var(--ok)}.test-result.error{color:var(--danger)}textarea{width:100%;min-height:80px;background:#071015;border:1px solid var(--line);color:var(--text);padding:9px;border-radius:5px;font:inherit;resize:vertical}.agentEvents{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.empty{color:var(--muted);padding:20px 0;text-align:center}@media(max-width:700px){.panel{left:12px;right:76px;top:12px;bottom:12px;width:auto}.dock{right:10px}.topbar{left:10px;right:74px}.brand{display:none}}
</style>
</head>
<body>
<div id="app">
  <iframe class="face" src="__VISUALIZER_URL__" title="Jarvis visualizer"></iframe>
  <div class="topbar"><div class="brand">JARVIS</div><div class="state">VOICE <strong id="voiceState">IDLE</strong> · CLAUDE <strong id="agentState">STOPPED</strong></div></div>
  <div class="voicehint" id="voiceHint">F9 · DÉMARRER</div>
  <nav class="dock" aria-label="Jarvis tools">
    <div class="tool"><button data-panel="errors" title="Errors">ERR</button><span class="badge" id="errorBadge">0</span></div>
    <div class="tool"><button data-panel="trace" title="Trace">TRC</button></div>
    <div class="tool"><button data-panel="settings" title="Settings">SET</button></div>
    <div class="tool"><button data-panel="agents" title="Agents">AGT</button></div>
  </nav>
  <section class="panel" id="panel"><header><h2 id="panelTitle">Panel</h2><button id="closePanel" aria-label="Fermer">×</button></header><div class="body" id="panelBody"></div></section>
</div>
<script>
const $=s=>document.querySelector(s);let current=null;const panel=$('#panel'),body=$('#panelBody'),title=$('#panelTitle');
async function api(path,opts){const r=await fetch(path,opts),text=await r.text();let value={};try{value=text?JSON.parse(text):{}}catch{value={error:text}}if(!r.ok)throw new Error(value.error||value.code||text);return value}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const ICONS=[[/^tool\./,'🔧'],[/^voice\.transcript/,'🎤'],[/^voice\.assistant/,'💬'],[/^voice\.(wake|active|connecting|speech_started|input_)/,'👂'],[/^voice\./,'🎙️'],[/^audio\./,'🔊'],[/^agent\./,'🤖'],[/^calendar\./,'📅'],[/^settings\./,'⚙️'],[/^(supervisor|process)\./,'⚡'],[/^ui\./,'🖥️'],[/^provider\./,'☁️'],[/^errors\./,'🗄️']];
function iconFor(kind){for(const [re,ic] of ICONS)if(re.test(kind))return ic;return '•'}
function statusFor(x){const k=String(x.kind||''),lvl=String(x.level||'info'),r=x.data&&x.data.result;if(x.data&&x.data.is_error)return 'bad';if(r&&typeof r==='object'&&r.executed===false)return 'warn';if(lvl==='error'||/fail|error|crash|giveup|denied/.test(k))return 'bad';if(lvl==='warning'||/skip|cancel|timeout|degraded|unavailable/.test(k))return 'warn';if(/connecting|spawn|start|wake/.test(k))return 'busy';return 'ok'}
function timeOf(ts){const t=String(ts||'');return t.length>19?t.slice(11,23):t}
function entries(items){if(!items.length)return '<div class="empty">Aucune entrée.</div>';return items.slice().reverse().map(x=>{const data=x.data&&Object.keys(x.data).length?x.data:null;return `<details class="entry ${x.level==='error'?'error':''}"><summary><span class="ico">${iconFor(String(x.kind||''))}</span><span class="etxt"><span class="emsg">${esc(x.message)}</span><span class="emeta">${esc(timeOf(x.ts))} · ${esc(x.kind)}${x.archived_at?' · archivé le '+esc(timeOf(x.archived_at)):''}</span></span><span class="dot ${statusFor(x)}"></span></summary><div class="detail"><div class="emeta" style="margin-bottom:6px"><span class="chip">${esc(x.level)}</span>${esc(x.ts)}</div>${data?`<pre class="log">${esc(JSON.stringify(data,null,2))}</pre>`:'<div class="hint">Aucun détail supplémentaire.</div>'}</div></details>`}).join('')}
let errorsView='active';
async function renderErrors(){const archived=errorsView==='archived';title.textContent=archived?'Errors · Archives':'Errors';const items=await api('/api/errors'+(archived?'?archived=1&limit=500':''));body.innerHTML=`<div class="row" style="margin-bottom:12px"><button class="action" id="toggleErrors">${archived?'Erreurs actives':'Erreurs archivées'}</button>${archived?'':'<button class="action danger" id="archiveErrors">Archiver</button>'}<span class="hint">${items.length} entrée(s)</span></div><div>${entries(items)}</div>`;$('#toggleErrors').addEventListener('click',()=>{errorsView=archived?'active':'archived';renderErrors().catch(e=>{body.innerHTML=`<div class="entry error">${esc(e.message)}</div>`})});const archive=$('#archiveErrors');if(archive)archive.addEventListener('click',async()=>{archive.disabled=true;try{await api('/api/errors/archive',{method:'POST'});await renderErrors();refreshStatus()}catch(e){alert(e.message)}finally{archive.disabled=false}})}
async function refreshStatus(){try{const s=await api('/api/status'),v=s.voice_state||'idle',k=String(s.manual_wake_key||'f9').toUpperCase(),online=s.voice_online===true;$('#voiceState').textContent=online?v.toUpperCase():'OFFLINE';const listening=s.voice_turn_mode==='manual'?`${k} · ENVOYER`:`${k} · ANNULER`;$('#voiceHint').textContent=online?({idle:`${k} · DÉMARRER`,listening,thinking:`${k} · ANNULER`,speaking:`${k} · INTERROMPRE`}[v]||`${k} · CONTRÔLER`):`${k} · VOICE HORS LIGNE`;$('.face').style.visibility=online?'visible':'hidden';$('#agentState').textContent=(s.agent.state||'stopped').toUpperCase();const b=$('#errorBadge');b.textContent=s.error_count;b.style.display=s.error_count?'flex':'none';if(current==='agents'){if(agentView==='transcript')renderTranscript().catch(()=>{});else renderAgents(s.agent)}}catch(e){$('#voiceState').textContent='OFFLINE';$('#agentState').textContent='OFFLINE';$('#voiceHint').textContent='VOICE HORS LIGNE';$('.face').style.visibility='hidden'}}
async function openPanel(name){current=name;document.querySelectorAll('.dock button').forEach(b=>b.classList.toggle('active',b.dataset.panel===name));panel.classList.add('open');title.textContent={errors:'Errors',trace:'Trace',settings:'Settings',agents:'Agents'}[name];body.innerHTML='<div class="empty">Chargement…</div>';try{if(name==='errors')await renderErrors();if(name==='trace')body.innerHTML=entries(await api('/api/trace'));if(name==='settings'){const [s,d]=await Promise.all([api('/api/settings'),api('/api/audio/devices')]);renderSettings(s,d)}if(name==='agents'){if(agentView==='transcript')await renderTranscript(true);else renderAgents(await api('/api/agent'),true)}}catch(e){body.innerHTML=`<div class="entry error">${esc(e.message)}</div>`}}
function deviceOptions(items,selected,defaultId){const chosen=String(selected??''),defaultDevice=items.find(x=>String(x.id)===String(defaultId)),defaultLabel=defaultDevice?` (${defaultDevice.name})`:'',missing=chosen!==''&&!items.some(x=>String(x.id)===chosen)?`<option value="${esc(chosen)}" selected>Périphérique indisponible (#${esc(chosen)})</option>`:'';return missing+`<option value="" ${chosen===''?'selected':''}>Système par défaut${esc(defaultLabel)}</option>`+items.map(x=>`<option value="${esc(x.id)}" ${chosen===String(x.id)?'selected':''}>${esc(x.name)}${x.hostapi?' · '+esc(x.hostapi):''}</option>`).join('')}
function renderSettings(s,d){body.innerHTML=`<form class="settings" id="settingsForm"><label>Entrée microphone<select name="audio_input_device">${deviceOptions(d.inputs||[],s.audio_input_device,d.defaults?.input)}</select></label><label>Sortie haut-parleur<select name="audio_output_device">${deviceOptions(d.outputs||[],s.audio_output_device,d.defaults?.output)}</select></label><div class="row"><button class="action" type="button" id="testAudio">Tester micro + sortie</button></div><div class="test-result" id="audioTestResult">Parlez pendant le test : les 2 secondes enregistrées seront rejouées.</div><label>Voix JARVIS<select name="realtime_voice">${(s.realtime_voices||[]).map(v=>`<option value="${esc(v)}" ${v===s.realtime_voice?'selected':''}>${esc(v)}</option>`).join('')}</select></label><label>Fin de tour<select name="voice_turn_mode">${(s.voice_turn_modes||[]).map(m=>`<option value="${esc(m)}" ${m===s.voice_turn_mode?'selected':''}>${m==='auto'?'Automatique (silence)':'Manuelle (2e appui)'}</option>`).join('')}</select></label><label>Claude CLI<input name="claude_cli" value="${esc(s.claude_cli)}"></label><label>Autorisations Claude<select name="claude_permission_mode">${(s.claude_permission_modes||[]).map(m=>`<option value="${esc(m)}" ${m===s.claude_permission_mode?'selected':''}>${m==='bypassPermissions'?'Tout autoriser (aucune demande)':m}</option>`).join('')}</select></label><div class="hint">En vocal personne ne peut approuver une demande d’autorisation : hors « tout autoriser », Claude refusera d’écrire ou d’exécuter.</div><label>OpenAI API key<input name="openai_api_key" type="password" placeholder="${s.openai_api_key_set?'Configured — leave blank to keep':'Not configured'}"></label><label>Porcupine access key<input name="porcupine_access_key" type="password" placeholder="${s.porcupine_access_key_set?'Configured — leave blank to keep':'Not configured'}"></label><label>Manual wake key<input name="manual_wake_key" value="${esc(s.manual_wake_key)}"></label><label>Active timeout (seconds)<input name="active_timeout_s" type="number" min="5" value="${esc(s.active_timeout_s)}"></label><div class="row"><button class="action" type="submit">Enregistrer</button></div><div class="hint">Les changements Voice prennent effet au prochain redémarrage du runtime Voice.</div></form>`;const form=$('#settingsForm'),result=$('#audioTestResult'),test=$('#testAudio');form.addEventListener('submit',async e=>{e.preventDefault();const p=Object.fromEntries(new FormData(form).entries());try{await api('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});await openPanel('settings')}catch(err){alert(err.message)}});test.addEventListener('click',async()=>{const p=Object.fromEntries(new FormData(form).entries());test.disabled=true;result.className='test-result';result.textContent='Parlez maintenant pendant 2 secondes…';try{const r=await api('/api/audio/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({input_device:p.audio_input_device,output_device:p.audio_output_device})});await api('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});result.className='test-result ok';result.textContent=`Test réussi · pic ${r.peak_dbfs} dBFS · enregistrement rejoué et sélection sauvegardée.`}catch(err){result.className='test-result error';result.textContent=err.message}finally{test.disabled=false}})}
let agentView='controls',transcriptCount=-1,agentSignature='';
const ROLE_ICONS={user:'🧑',assistant:'🤖',system:'⚙️',result:'✅',stderr:'⚠️',notice:'📊',stdout:'📄'};
function agentHeader(a){const c=a.console||{};return `<div class="row"><span class="statusdot ${a.state==='running'?'running':''}"></span><strong>Claude</strong><span class="hint">${esc(a.state)}${a.pid?' · PID '+esc(a.pid):''}${a.session_id?' · session '+esc(String(a.session_id).slice(0,8)):''}</span></div><div class="row" style="margin-top:10px"><button class="action" id="openConsole"${c.supported===false?' disabled':''}>🖥️ Console Windows</button>${c.open?`<button class="action danger" id="closeConsole">Fermer la console</button><span class="dot busy" title="console ouverte"></span><span class="hint">PID ${esc(c.pid)}</span>`:''}</div><div class="hint" id="consoleHint" style="margin-top:6px">${c.open?'Console de debug ouverte : elle a la main sur la conversation.':'Ouvre la vraie console Claude dans une fenêtre Windows, sur cette même conversation. L’agent piloté rend la main pendant ce temps.'}</div>`}
function bindConsole(after){const open=$('#openConsole');if(open)open.addEventListener('click',async()=>{open.disabled=true;$('#consoleHint').textContent='Ouverture de la console…';try{const r=await api('/api/agent/console/open',{method:'POST'});$('#consoleHint').textContent=r.already_open?(r.raised?'Console existante ramenée au premier plan.':'Console déjà ouverte (fenêtre à retrouver dans la barre des tâches).'):(r.handover?'Console ouverte, conversation reprise. L’agent piloté a été arrêté.':'Console ouverte.')}catch(e){$('#consoleHint').textContent=e.message}finally{open.disabled=false;setTimeout(after,400)}});const close=$('#closeConsole');if(close)close.addEventListener('click',async()=>{close.disabled=true;try{await api('/api/agent/console/close',{method:'POST'})}catch(e){alert(e.message)}finally{setTimeout(after,300)}})}
function sendBox(){return `<div style="margin-top:14px"><textarea id="agentInput" placeholder="Message direct au Claude local…"></textarea><button class="action" id="sendAgent" style="margin-top:7px">Envoyer</button></div>`}
function bindSend(after){$('#sendAgent').addEventListener('click',async()=>{const input=$('#agentInput'),text=input.value.trim();if(!text)return;input.value='';try{await api('/api/agent/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})})}catch(e){alert(e.message)}transcriptCount=-1;setTimeout(after,300)})}
function transcriptEntries(items){if(!items.length)return '<div class="empty">Aucun échange. Envoyez un message pour démarrer la conversation.</div>';return items.map(e=>`<details class="entry"><summary><span class="ico">${ROLE_ICONS[e.role]||'•'}</span><span class="etxt"><span class="emsg">${esc(e.text||e.title)}</span><span class="emeta">${esc(e.title)}</span></span><span class="dot ${esc(e.status||'ok')}"></span></summary><div class="detail"><pre class="log">${esc(JSON.stringify(e.raw,null,2))}</pre></div></details>`).join('')}
async function renderTranscript(force){if(current!=='agents'||agentView!=='console')return;const c=await api('/api/agent/transcript');if(!force&&c.events.length===transcriptCount)return;transcriptCount=c.events.length;title.textContent='Claude · Historique';body.innerHTML=`${agentHeader(c)}<div class="row" style="margin-top:10px"><button class="action" id="agentControls">← Contrôles</button><span class="hint">${esc(c.command)} · ${esc(c.cwd)}</span></div><div class="agentEvents">${transcriptEntries(c.events)}</div>${sendBox()}`;$('#agentControls').addEventListener('click',()=>{agentView='controls';transcriptCount=-1;openPanel('agents')});bindConsole(()=>renderTranscript(true));bindSend(()=>renderTranscript(true));body.scrollTop=body.scrollHeight}
function agentSig(a){const c=a.console||{};return [a.state,a.pid,a.session_id,c.open,c.pid,(a.events||[]).length].join('|')}
function renderAgents(a,force){if(current!=='agents'||agentView==='transcript')return;const sig=agentSig(a);if(!force&&sig===agentSignature)return;agentSignature=sig;title.textContent='Agents';body.innerHTML=`${agentHeader(a)}<div class="row" style="margin-top:12px"><button class="action" data-agent="start">Start</button><button class="action" data-agent="restart">Restart</button><button class="action danger" data-agent="kill">Kill</button><button class="action" id="agentConsoleBtn">Historique</button></div>${sendBox()}<div class="agentEvents">${transcriptEntries((a.events||[]).map(transcriptFallback))}</div>`;document.querySelectorAll('[data-agent]').forEach(b=>b.addEventListener('click',async()=>{await api('/api/agent/'+b.dataset.agent,{method:'POST'});await openPanel('agents')}));bindConsole(()=>openPanel('agents'));$('#agentConsoleBtn').addEventListener('click',()=>{agentView='transcript';transcriptCount=-1;renderTranscript(true).catch(e=>{body.innerHTML=`<div class="entry error">${esc(e.message)}</div>`})});bindSend(()=>openPanel('agents'))}
function transcriptFallback(x){return {role:String(x.type||'event'),title:String(x.type||'event'),text:'',status:'ok',raw:x}}
document.querySelectorAll('.dock button').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.panel==='errors')errorsView='active';openPanel(b.dataset.panel)}));$('#closePanel').addEventListener('click',()=>{current=null;panel.classList.remove('open');document.querySelectorAll('.dock button').forEach(b=>b.classList.remove('active'))});setInterval(refreshStatus,1000);refreshStatus();
</script>
</body>
</html>
