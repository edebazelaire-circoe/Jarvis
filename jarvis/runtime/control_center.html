const ctxMenu=$('#ctxMenu');
function menuItems(id){
  const t=findTask(id),items=[{act:'trace',label:"Trace d'exécution",key:'Entrée'},{act:'details',label:'Détails'}];
  if(id!=='brain'){
    items.push({act:'copy',label:'Copier le prompt',disabled:!t||!t.prompt});
    return items;
  }
  const a=AG.agent||{},c=a.console||{},running=(a.state||(t&&t.state))==='running';
  items.push('-',
    {act:'start',label:'Démarrer',disabled:running},
    {act:'restart',label:'Redémarrer'},
    {act:'kill',label:'Arrêter',danger:true,disabled:!running},
    '-');
  if(c.open)items.push({act:'console-open',label:'Ramener la console Windows'},{act:'console-close',label:'Fermer la console Windows',danger:true});
  else items.push({act:'console-open',label:'Console Windows',disabled:c.supported===false});
  return items;
}
function anchorOf(card){
  const r=card.getBoundingClientRect();
  return {x:r.left+44,y:r.top+Math.min(r.height-6,46),above:r.top+8};
}
function anchorBelow(el){
  const r=el.getBoundingClientRect();
  return {x:r.left,y:r.bottom+4,above:r.top-4,alignRight:r.right};
}
function openMenu(id,pos,origin){
  closeMenu(false);
  const t=findTask(id);
  if(!t)return;
  ctxMenu.innerHTML=`<div class="mhead">${esc(t.id==='brain'?'Brain':taskTitle(t))}</div>`+menuItems(id).map(it=>it==='-'
    ?'<div class="sep" role="separator"></div>'
    :`<button type="button" role="menuitem" data-act="${it.act}" class="${it.danger?'danger':''}"${it.disabled?' disabled':''}><span>${esc(it.label)}</span>${it.key?`<kbd>${esc(it.key)}</kbd>`:''}</button>`).join('');
  ctxMenu.setAttribute('aria-label',`Actions : ${t.id==='brain'?'Brain':taskTitle(t)}`);
  ctxMenu.style.left='0px';ctxMenu.style.top='0px';
  ctxMenu.hidden=false;
  const w=ctxMenu.offsetWidth,h=ctxMenu.offsetHeight,W=window.innerWidth,H=window.innerHeight;
  let x=pos.alignRight?pos.alignRight-w:pos.x,y=pos.y;
  if(x+w>W-8)x=W-w-8;
  if(y+h>H-8)y=(pos.above??y)-h;
  ctxMenu.style.left=Math.max(8,x)+'px';
  ctxMenu.style.top=Math.max(8,Math.min(y,H-h-8))+'px';
  AG.menu={id,origin,at:performance.now()};
  const first=ctxMenu.querySelector('button:not(:disabled)');
  if(first)first.focus({preventScroll:true});
}
function closeMenu(restore){
  if(!AG.menu){ctxMenu.hidden=true;return}
  const {id,origin}=AG.menu;
  AG.menu=null;
  ctxMenu.hidden=true;ctxMenu.innerHTML='';
  if(restore){
    const el=origin&&origin.isConnected?origin:cardEl(id);
    if(el)el.focus({preventScroll:true});
  }
  // Les mises à jour retenues pendant l'ouverture du menu reprennent.
  setTimeout(renderAgentsView,0);
}
async function runMenuAction(act,id){
  closeMenu(act!=='trace'&&act!=='details');
  if(act==='trace')return showTrace(id);
  if(act==='details')return showDetails(id);
  if(act==='copy'){
    const t=findTask(id);
    const ok=t&&t.prompt?await copyText(t.prompt):false;
    return toast({title:ok?'Prompt copié':'Copie impossible',sub:ok?taskTitle(t):'Le navigateur a refusé l’accès au presse-papiers.',kind:ok?'info':'bad',ms:2500});
  }
  if(act==='start'||act==='restart'||act==='kill')return brainAction(act);
  if(act==='console-open'||act==='console-close')return consoleAction(act);
}
async function copyText(text){
  try{await navigator.clipboard.writeText(text);return true}catch{}
  const area=document.createElement('textarea');
  area.value=text;area.style.position='fixed';area.style.opacity='0';
  document.body.appendChild(area);area.select();
  let ok=false;
  try{ok=document.execCommand('copy')}catch{}
  area.remove();
  return ok;
}
async function brainAction(act){
  const running=activeAgents().length;
  if((act==='kill'||act==='restart')&&running&&!confirm(`${act==='kill'?'Arrêter':'Redémarrer'} le brain interrompra ${plural(running,'sous-agent en cours','sous-agents en cours')}. Continuer ?`))return;
  try{
    await api('/api/agent/'+act,{method:'POST'});
    toast({title:{start:'Brain démarré',restart:'Brain redémarré',kill:'Brain arrêté'}[act],kind:act==='kill'?'warn':'ok',ms:3000});
  }catch(e){toast({title:'Action impossible',sub:e.message,kind:'bad'})}
  refreshStatus();
  if(current==='agents')agentsTick();
}
async function consoleAction(act){
  try{
    if(act==='console-close'){
      await api('/api/agent/console/close',{method:'POST'});
      toast({title:'Console Windows fermée',kind:'info',ms:3000});
    }else{
      const r=await api('/api/agent/console/open',{method:'POST'});
      const text=r.already_open?(r.raised?'Console existante ramenée au premier plan.':'Console déjà ouverte : fenêtre à retrouver dans la barre des tâches.'):(r.handover?'Conversation reprise. L’agent piloté a été arrêté.':'Console ouverte sur cette conversation.');
      toast({title:'Console Windows',sub:text,kind:'info'});
    }
  }catch(e){toast({title:'Console Windows',sub:e.message,kind:'bad'})}
  setTimeout(refreshStatus,400);
}

ctxMenu.addEventListener('mousedown',e=>e.preventDefault());  // garder le focus clavier dans le menu

ctxMenu.addEventListener('mouseover',e=>{
  const button=e.target.closest('button[data-act]:not(:disabled)');
  if(button&&document.activeElement!==button)button.focus({preventScroll:true});
});
ctxMenu.addEventListener('keydown',e=>{
  // Le menu garde ses touches : Échap ou une lettre ne doivent pas déclencher
  // les raccourcis d'interface (fermer le panneau, en ouvrir un autre).
  e.stopPropagation();
  const items=[...ctxMenu.querySelectorAll('button:not(:disabled)')];
  const i=items.indexOf(document.activeElement);
  const go=n=>{e.preventDefault();if(items.length)items[(n+items.length)%items.length].focus()};
  if(e.key==='ArrowDown')go(i+1);
  else if(e.key==='ArrowUp')go(i<0?-1:i-1);
  else if(e.key==='Home')go(0);
  else if(e.key==='End')go(-1);
  else if(e.key==='Escape'||e.key==='Tab'||e.key==='ContextMenu'||(e.key==='F10'&&e.shiftKey)){e.preventDefault();closeMenu(true)}
});
ctxMenu.addEventListener('focusout',e=>{if(AG.menu&&!ctxMenu.contains(e.relatedTarget))closeMenu(false)});

/* =====================================================================
   Fenêtre de réglages
   =====================================================================
   Le serveur décrit ce qui existe (piles vocales, CLI, champs, raccourcis),
   cette page ne fait que le rendre. Ajouter une option côté Python suffit :
   aucun champ n'est écrit en dur ici, et les listes de modèles viennent du
   catalogue réel du fournisseur, jamais d'une liste figée.                */

const TABS=[
  {id:'voice',label:'Mode vocal',save:true},
  {id:'prompts',label:'Prompts',save:false},
  {id:'cli',label:'CLI agent',save:true},
  {id:'routing',label:'Aiguillage',save:true},
  {id:'config',label:'Config',save:true},
  {id:'keys',label:'API Keys',save:false},
  {id:'shortcuts',label:'Raccourcis',save:false},
];
const SET={open:false,tab:'voice',data:null,draft:null,dirty:false,catalog:{},clis:null,devices:null,capture:null,shortcuts:null,restartNotice:false,rdOpen:false,routing:null,prompts:null};
const overlay=$('#overlay'),modalContent=$('#modalContent'),modalStatus=$('#modalStatus'),modalSave=$('#modalSave'),modalSub=$('#modalSub');

function say(text,kind){modalStatus.className='status'+(kind?' '+kind:'');modalStatus.textContent=text||''}

/* Catalogue de modèles : une entrée par (fournisseur, usage), gardée le temps
   de la session pour ne pas rappeler l'API à chaque changement d'onglet. */
async function catalog(provider,role,refresh){
  const key=provider+':'+role;
  if(SET.catalog[key]&&!refresh)return SET.catalog[key];
  let value;
  try{
    value=await api(`/api/models?provider=${encodeURIComponent(provider)}&role=${encodeURIComponent(role)}${refresh?'&refresh=1':''}`);
  }catch(e){value={ok:false,error:e.message,models:[]}}
  SET.catalog[key]=value;return value;
}

function catalogNote(result,provider){
  const name=providerLabel(provider);
  if(result.ok&&result.source==='live')return `<span class="note">${result.models.length} modèle(s) · liste demandée à l'API ${esc(name)} à l'instant</span>`;
  if(result.ok)return `<span class="note">${result.models.length} modèle(s) · liste ${esc(name)} en cache</span>`;
  if(result.source==='stale')return `<span class="note warn">Liste ${esc(name)} périmée (dernier appel réussi) — ${esc(result.error||'')}</span>`;
  return `<span class="note bad">${esc(result.error||'Catalogue indisponible.')}</span>`;
}

function selectOptions(values,selected,placeholder){
  const chosen=String(selected??'');
  const missing=chosen&&!values.some(v=>String(v.value)===chosen)
    ? `<option value="${esc(chosen)}" selected>${esc(chosen)} (absent du catalogue)</option>` : '';
  const head=placeholder?`<option value="" ${chosen===''?'selected':''}>${esc(placeholder)}</option>`:'';
  return missing+head+values.map(v=>`<option value="${esc(v.value)}" ${chosen===String(v.value)?'selected':''}>${esc(v.label)}</option>`).join('');
}

/* --- champs décrits par le serveur ------------------------------------- */
async function renderField(field,values,scope){
  if(field.depends_on&&!(field.depends_values||[]).includes(String(values[field.depends_on])))return '';
  const id=`f_${scope}_${field.key}`,value=values[field.key];
  const hint=field.hint?`<div class="hint">${esc(field.hint)}</div>`:'';
  if(field.kind==='toggle'){
    return `<div class="field inline"><input type="checkbox" id="${id}" data-field="${esc(field.key)}" data-scope="${esc(scope)}" ${value?'checked':''}><div><label for="${id}">${esc(field.label)}</label>${hint}</div></div>`;
  }
  if(field.kind==='number'){
    const attrs=['min','max','step','placeholder'].filter(k=>field[k]!==undefined).map(k=>`${k}="${esc(field[k])}"`).join(' ');
    return `<div class="field"><label for="${id}">${esc(field.label)}</label><input type="number" id="${id}" data-field="${esc(field.key)}" data-scope="${esc(scope)}" value="${esc(value)}" ${attrs}>${hint}</div>`;
  }
  if(field.source){
    const [provider,role]=field.source.split(':');
    const result=await catalog(provider,role);
    const options=(result.models||[]).map(m=>({value:m.id,label:m.label&&m.label!==m.id?`${m.id} — ${m.label}`:m.id}));
    return `<div class="field"><label for="${id}">${esc(field.label)}</label>`+
      `<select id="${id}" data-field="${esc(field.key)}" data-scope="${esc(scope)}">${selectOptions(options,value,'Valeur par défaut du service')}</select>`+
      `<div class="source">${catalogNote(result,provider)} <button class="linkish" data-refresh="${esc(field.source)}">rafraîchir</button></div>${hint}</div>`;
  }
  if(field.kind==='text'){
    return `<div class="field"><label for="${id}">${esc(field.label)}</label><input id="${id}" data-field="${esc(field.key)}" data-scope="${esc(scope)}" value="${esc(value)}">${hint}</div>`;
  }
  const labels=field.option_labels||[];
  const options=(field.options||[]).map((o,i)=>({value:o,label:labels[i]||o}));
  return `<div class="field"><label for="${id}">${esc(field.label)}</label><select id="${id}" data-field="${esc(field.key)}" data-scope="${esc(scope)}">${selectOptions(options,value,field.placeholder||'')}</select>${hint}</div>`;
}

function providerLabel(id){
  const found=(SET.data.credentials.providers||[]).find(p=>p.id===id);
  return found?found.label:id;
}

function keyStateFor(provider){
  const state=SET.data.credentials||{};
  const bound=(state.bindings||{})[provider];
  const item=(state.credentials||[]).find(c=>c.id===bound)||(state.credentials||[]).find(c=>c.provider===provider);
  if(item)return `<span class="tag ok">clé « ${esc(item.name)} »</span>`;
  if(((state.environment||{})[provider]||[]).length)return `<span class="tag warn">clé d'environnement</span>`;
  return `<span class="tag bad">aucune clé</span>`;
}

/* --- Qui peut parler à JARVIS (Solo Owner, tâche 08) --------------------
   La page projette un état, elle ne décide rien : le verdict (prêt, dégradé,
   refusé) vient du serveur, qui l'évalue avec la fonction même dont Voice se
   sert, et ce que Voice a réellement appliqué l'emporte. Aucune empreinte
   vocale n'arrive jusqu'ici, seulement des métadonnées. Les champs sont
   décrits par le serveur ; seules les clés touchées partent à l'enregistrement. */
const AUTH_SCOPE='authorization';
const AUTH_STATUS={ready:{cls:'ok',label:'prêt'},degraded:{cls:'warn',label:'dégradé'},refused:{cls:'bad',label:'refusé'},invalid:{cls:'bad',label:'réglage invalide'}};
const AEC_STATUS={ready:{cls:'ok',label:'active'},degraded:{cls:'',label:'dégradée'},off:{cls:'',label:'désactivée'},not_applicable:{cls:'info',label:'sans objet'}};
function authValues(a){return {...(a.stored||{}),...((a.verifier_settings||{}).stored||{}),...SET.draft.voice.authorization}}
function whenOf(ts){if(!ts)return '';const d=new Date(ts*1000);return isNaN(d)?'':d.toLocaleTimeString('fr-FR')}
function voiceSeen(block,what){const r=block.runtime||{};return `Constaté par Voice${r.phase?` (${esc(r.phase)}${r.ts?`, ${esc(whenOf(r.ts))}`:''})`:''}`+(what?` — ${what}`:'')}
function codeTag(code){return code?` <span class="tag">${esc(code)}</span>`:''}
function authVerdictHtml(a){
  const st=AUTH_STATUS[a.status]||{cls:'bad',label:a.status};
  const eff=a.effective,r=a.runtime||{};
  const src=a.status_source==='voice'?voiceSeen(a,'ce que seule Voice pouvait voir')
    :eff&&r.status==='ready'&&r.conversation_mode===eff.conversation_mode?voiceSeen(a,'appliqué à sa dernière activation')
    :"D'après la sonde des réglages (le modèle n'est pas chargé ici)";
  const why=a.problem?` ${esc(a.problem)}${codeTag(a.code)}`:'';
  if(!eff)return `<div class="notice bad"><strong>Réglage invalide</strong> : Voice refuse d'écouter tant qu'il n'est pas corrigé.${why}</div>`;
  const tag=`<span class="tag ${st.cls}">${esc(st.label)}</span> `;
  if(eff.conversation_mode==='solo_owner'){
    if(a.status==='ready')return `<div class="notice ok">${tag}<strong>Solo Owner appliqué</strong> : seule votre voix reconnue coupe JARVIS et devient un tour (vérification enforce).<div class="hint">${src}.</div></div>`;
    return `<div class="notice bad">${tag}<strong>Solo Owner configuré mais NON appliqué</strong> : JARVIS ne peut pas vérifier votre identité, donc Voice refuse d'écouter dans ce mode — aucun repli silencieux sur la salle ouverte.${why}<div class="hint">${src}.</div></div>`;
  }
  if(eff.speaker_verification==='shadow'){
    const legacy=SET.data.voice.architecture.compatibility_runtime&&SET.data.voice.arch_effective!=='continuous_brain'?" L'observation ne tourne qu'en conversation continue : sous « Un tour par appui », rien n'est mesuré.":'';
    if(a.status==='ready')return `<div class="notice info">${tag}<strong>Salle ouverte, vérification en ombre</strong> : les scores sont mesurés et journalisés (voice.owner.*), rien n'est filtré — toute voix peut couper JARVIS.${esc(legacy)}<div class="hint">${src}.</div></div>`;
    return `<div class="notice">${tag}<strong>Salle ouverte, observation dégradée</strong> : rien n'est mesuré ; la conversation reste ouverte à toutes les voix.${why}<div class="hint">${src}.</div></div>`;
  }
  return `<div class="notice info">${tag}<strong>Salle ouverte</strong> : toute voix captée peut couper JARVIS et devenir un tour (comportement historique). Aucune vérification d'identité.</div>`;
}
function authEffectiveHtml(a){
  const vs=a.verifier_settings||{},eff={...(a.effective||{}),...(vs.effective||{})},origin={...(a.origin||{}),...(vs.origin||{})};
  const fields=[...(a.fields||[]),...(a.advanced_fields||[])];
  const rows=fields.map(f=>{
    let v=eff[f.key];
    if(f.key==='speaker_verification'&&origin[f.key]==='default'&&v)v=`${v} (selon le mode)`;
    if(f.key==='owner_short_evidence_ms'&&v===0)v='0 (règle brève désactivée)';
    const tag=origin[f.key]==='stored'?'<span class="tag">réglage</span>':'<span class="tag">défaut</span>';
    return `<dt>${esc(f.label)}</dt><dd>${v===undefined||v===null?'—':esc(v)} ${tag}</dd>`}).join('');

  return `${invalid}<dl class="kv">${rows}${path}</dl>`;
}
function verifierHtml(a){

async function authSectionHtml(){

  for(const f of a.fields||[]){

function voiceArchitectureConfig(){
  return SET.draft.voice.architecture||((SET.data.voice.architecture.selection||{}).config)||{};
}
function modelRefKey(value){return JSON.stringify(value&&{provider_id:value.provider_id,model_id:value.model_id});}
function voiceArchitectureChanged(key,value){
  const query=SET.data.voice.architecture;
  if(key==='architecture'){
    const profile=query.architectures.find(item=>item.id===value);
    if(!profile)return;
    const current=voiceArchitectureConfig();
    SET.draft.voice.architecture=JSON.parse(JSON.stringify(current.architecture===value?current:profile.defaults));
  }else{
    SET.draft.voice.architecture=JSON.parse(JSON.stringify(voiceArchitectureConfig()));
    SET.draft.voice.architecture[key]=value;
  }
  SET.architectureDirty=true;SET.dirty=true;
}
async function voiceArchitectureHtml(){
  const query=SET.data.voice.architecture,config=voiceArchitectureConfig();
  const profile=query.architectures.find(item=>item.id===config.architecture);
  const options=query.architectures.map(item=>`<option value="${esc(item.id)}" ${item.id===config.architecture?'selected':''}>${esc(item.label)}</option>`).join('');
  let html=`<h3>Architecture vocale</h3><div class="field"><label for="voiceArchitecture">Architecture</label><select id="voiceArchitecture" data-voice-architecture><option value="" disabled ${profile?'':'selected'}>Choisir une architecture</option>${options}</select></div>`;
  if(query.compatibility_runtime&&!SET.architectureDirty)html+='<div class="notice">Compatibilité conservée. Enregistrer sans modifier ce choix garde le fonctionnement actuel. Modifier un modèle ou choisir explicitement une architecture prépare le nouveau mode.</div><button class="action" data-architecture-activate>Utiliser explicitement cette architecture</button>';
  if(query.problem&&!SET.architectureDirty)html+=`<div class="notice bad">${esc(query.problem.message)}</div>`;
  if(!profile)return html;
  html+=`<div class="hint">${esc(profile.description)}</div>`;
  for(const field of profile.fields){
    const value=config[field.key]??field.default,id='architecture_'+field.key;
    let input='';
    if(field.kind==='model'){
      const key=modelRefKey(value),found=field.options.some(option=>modelRefKey(option)===key);
      const missing=found?'':`<option value="${esc(key||'null')}" selected disabled>${esc(value?value.provider_id+' / '+(value.model_id||'(modèle manquant)'):'Aucun modèle')} — modèle non pris en charge</option>`;
      input=`<select id="${id}" data-architecture-field="${esc(field.key)}" data-architecture-kind="model">${missing}${field.options.map(option=>`<option value="${esc(modelRefKey(option))}" ${modelRefKey(option)===key?'selected':''} ${option.selectable?'':'disabled'}>${esc(option.label)}${option.reason?' — '+esc(option.reason):''}</option>`).join('')}</select>`;
      const selected=field.options.find(option=>modelRefKey(option)===key);
      if(selected)input+=`<div class="hint">Adaptateur : ${esc(selected.adapter_status)} · Disponibilité compte : ${esc(selected.availability)}${selected.reason?' — '+esc(selected.reason):''}</div>`;
    }else if(field.kind==='select'){
      const sourceField=profile.fields.find(item=>item.key===field.options_from);
      const selected=sourceField&&sourceField.options.find(item=>modelRefKey(item)===modelRefKey(config[field.options_from]));
      const values=selected?(selected[field.options_property]||[]):[];
      input=`<select id="${id}" data-architecture-field="${esc(field.key)}">${values.includes(value)?'':`<option value="${esc(value??'')}" selected disabled>${esc(value??'Non configuré')} — indisponible</option>`}${values.map(item=>`<option value="${esc(item)}" ${item===value?'selected':''}>${esc(item)}</option>`).join('')}</select>`;
    }else if(field.kind==='toggle')input=`<input id="${id}" type="checkbox" data-architecture-field="${esc(field.key)}" ${value?'checked':''} ${field.readonly?'disabled':''}>`;
    else if(field.kind==='number')input=`<input id="${id}" type="number" min="${field.min}" max="${field.max}" value="${esc(value)}" data-architecture-field="${esc(field.key)}">`;
    html+=`<div class="field"><label for="${id}">${esc(field.label)}</label>${input}</div>`;
  }
  // Provider settings are projected by the registry, never chosen by a JS model switch.
  for(const field of profile.fields.filter(item=>item.kind==='model')){
    const selected=field.options.find(item=>modelRefKey(item)===modelRefKey(config[field.key]));
    if(!selected||!selected.settings_scope)continue;
    const scope=selected.settings_scope,values=SET.draft.voice.settings[scope]||{};
    for(const setting of selected.settings_fields||[])html+=await renderField(setting,values,scope);
  }
  return html;
}
async function tabVoice(){
  let html=await voiceArchitectureHtml();
  const sw=SET.data.voice.switch||{};
  if(sw.pending||sw.status==='blocked'||sw.status==='failed')html+=`<div class="notice ${sw.status==='blocked'||sw.status==='failed'?'bad':'warn'}"><strong>Changement vocal ${sw.status==='blocked'?'bloqué':sw.status==='failed'?'en échec':'en cours'}</strong>${sw.message?' : '+esc(sw.message):'. Voice ferme la session courante avant son redémarrage supervisé.'}</div>`;
  else if(sw.status==='ready_for_restart')html+='<div class="notice">Ancienne session fermée. Redémarrage supervisé de Voice en cours.</div>';

  html+=`${await authSectionHtml()}`;
  if(SET.data.voice.architecture.compatibility_runtime&&!SET.architectureDirty){
    const draft=SET.draft.voice,stacks=SET.data.voice.stacks,spec=stacks.find(s=>s.id===draft.stack)||stacks[0];

/* --- onglet Prompts -----------------------------------------------------
   Le serveur choisit les programmes actifs et compose leur aperçu. La page
   n'invente aucun prompt fournisseur et n'envoie que la couche éditée. */
function promptLayerHtml(layer, resolved){
  const conflict=layer.conflict?`<span class="tag bad">${esc(layer.conflict)}</span>`:'';
  const mode=layer.editable?'<span class="tag ok">modifiable</span>':'<span class="tag">lecture seule</span>';
  const source=resolved&&resolved.source==='override'?'<span class="tag warn">override</span>':'<span class="tag">défaut</span>';
  const value=String(layer.current_text??'');
  const editor=layer.editable
    ? `<textarea data-prompt-text="${esc(layer.prompt_id)}">${esc(value)}</textarea>
       <div class="row" style="margin-top:8px"><button type="button" class="action primary" data-prompt-save="${esc(layer.prompt_id)}" data-base-revision="${esc(layer.default_revision)}" data-effective-revision="${esc(layer.effective_revision)}">Enregistrer cette couche</button>
       <button type="button" class="action" data-prompt-reset="${esc(layer.prompt_id)}">Revenir au défaut</button></div>`
    : `<pre class="log block">${esc(value)}</pre>`;
  return `<details class="rd"><summary><code>${esc(layer.prompt_id)}</code> ${mode} ${source} ${conflict}</summary>
    <div class="source">${esc(layer.source_path)} :: ${esc(layer.source_symbol)}</div>
    <div class="hint" style="margin:7px 0">Canal ${esc(resolved&&resolved.channel||'')} · opération ${esc(resolved&&resolved.operation||'')} · application ${esc(layer.apply_policy)}</div>
    ${editor}</details>`;
}

async function tabPrompts(){
  if(!SET.prompts)SET.prompts=await api('/api/prompts').catch(e=>({error:e.message,programs:[],layers:[]}));
  const state=SET.prompts;
  if(state.error)return `<section><div class="notice bad">${esc(state.error)}</div></section>`;
  const byId=new Map((state.layers||[]).map(layer=>[layer.prompt_id,layer]));
  const programs=(state.programs||[]).map(program=>{
    const layers=(program.layers||[]).map(resolved=>{
      const layer=byId.get(resolved.prompt_id);
      return layer?promptLayerHtml(layer,resolved):'';
    }).join('');
    const channels=(program.channels||[]).map(channel=>`<details class="rd"><summary>Prompt effectif · <code>${esc(channel.channel)}</code> · ${esc(channel.operation)}</summary>
      <pre class="log block">${esc(channel.text??'Donnée runtime non liée')}</pre></details>`).join('');
    return `<h3>${esc(program.label)}</h3>
      <div class="source" style="margin-bottom:10px"><code>${esc(program.program_id)}</code> · empreinte statique <code>${esc(program.static_fingerprint)}</code></div>
      ${layers}${channels}`;
  }).join('');
  return `<section>
    <div class="notice info"><strong>Aperçu JARVIS</strong> : les données de conversation et de requête sont vides dans cet écran. L'ordre, les canaux et les couches sont ceux envoyés par le runtime.</div>
    <div class="notice"><strong>Application</strong> : enregistrer ne modifie aucune session active. Une couche de session s'applique au prochain démarrage concerné ; une couche d'invocation au prochain envoi correspondant. Les traces distinguent enregistré, envoyé et reconnu.</div>
    <div class="notice info">Les prompts internes du fournisseur ne sont pas exposés par son API et restent indiqués comme indisponibles. Seules les couches contrôlées par JARVIS figurent ici.</div>
    ${programs||'<div class="empty">Aucun programme de prompt applicable.</div>'}
  </section>`;
}

/* --- onglet Aiguillage ---------------------------------------------------
   Rien de ce qui est affiché ici n'est écrit dans cette page : les profils,
   les candidats et leur disponibilité viennent tous de /api/routing/candidates.
   Un candidat enregistré devenu indisponible reste coché et visible — sa
   disparition serait un réglage perdu en silence.                          */
function candidateLabel(c){return c.label||(c.model?`${c.agent} · ${c.model}`:c.agent)}
function candidateKey(c){return JSON.stringify({agent:c.agent,model:c.model||''})}

function routingRow(profile,candidate,chosen){
  const key=candidateKey(candidate);
  const rank=chosen.indexOf(key);
  const state=candidate.available
    ? '<span class="tag ok">disponible</span>'
    : `<span class="tag bad">indisponible</span>`;
  const why=candidate.available?'':`<div class="hint">${esc(candidate.unavailable_reason||'')}</div>`;
  const order=rank>=0?`<span class="tag">${rank===0?'préféré':'recours '+rank}</span>`:'';
  return `<label class="choice ${rank>=0?'selected':''}">
    <input type="checkbox" data-routing-candidate="${esc(key)}" data-routing-profile="${esc(profile)}" ${rank>=0?'checked':''}>
    <div><div class="title"><strong>${esc(candidateLabel(candidate))}</strong>${state}${order}</div>${why}</div>
  </label>`;
}

async function tabRouting(){
  if(!SET.routing)SET.routing=await api('/api/routing/candidates').catch(e=>({ok:false,error:e.message,profiles:[],candidates:[]}));
  const state=SET.routing,draft=SET.draft.routing;
  if(state.ok===false)return `<section><div class="notice bad">${esc(state.error||'Aiguillage indisponible.')}</div></section>`;
  const candidates=state.candidates||[];
  const blocks=(state.profiles||[]).map(profile=>{
    const entry=draft.profiles[profile.id]||{candidates:[],enabled:true,allow_general_fallback:true};
    const chosen=(entry.candidates||[]).map(candidateKey);
    const rows=candidates.map(c=>routingRow(profile.id,c,chosen)).join('');
    const empty=chosen.length?'':'<div class="hint">Aucun candidat autorisé : ce profil garde le modèle configuré du CLI.</div>';
    const fallback=profile.id==='general'?'':`<div class="field inline">
      <input type="checkbox" id="f_fb_${esc(profile.id)}" data-routing-fallback="${esc(profile.id)}" ${entry.allow_general_fallback?'checked':''}>
      <div><label for="f_fb_${esc(profile.id)}">Se rabattre sur le profil Général</label>
      <div class="hint">Quand aucun candidat de ce profil n'est utilisable, essayer ceux du profil Général plutôt que d'échouer.</div></div></div>`;
    return `<h3>${esc(profile.label)}</h3>
      <div class="hint" style="margin-bottom:8px">${esc(profile.description)}${profile.requires.length?` · exige : ${profile.requires.map(esc).join(', ')}`:''}</div>
      <div class="choices">${rows}</div>${empty}${fallback}`;
  }).join('');
  const sources=Object.entries(state.sources||{}).map(([provider,source])=>{
    const label=providerLabel(provider);
    if(source==='live')return `<span class="note">${esc(label)} : liste à jour</span>`;
    if(source==='cache')return `<span class="note">${esc(label)} : liste en cache</span>`;
    if(source==='stale')return `<span class="note warn">${esc(label)} : dernière liste connue</span>`;
    return `<span class="note bad">${esc(label)} : ${esc(source)}</span>`;
  }).join(' ');
  return `<section>
    <div class="field inline"><input type="checkbox" id="f_routing_on" data-routing-enabled ${draft.enabled?'checked':''}>
      <div><label for="f_routing_on">Choisir le modèle des sous-agents selon la tâche</label>
      <div class="hint">Décoché, rien ne change : chaque sous-agent garde le modèle par défaut du CLI. Coché, JARVIS impose pour chaque profil le premier candidat autorisé et utilisable, et corrige le modèle demandé par le cerveau si besoin.</div></div></div>
    <div class="source" style="margin-bottom:10px">${sources} <button class="linkish" id="routingRefresh">rafraîchir</button></div>
    ${blocks}
    <div class="hint" style="margin-top:14px">L'ordre des candidats est celui de la liste : le premier disponible est choisi, les suivants servent de recours. Les sous-agents s'exécutent dans le CLI vocal actif ; un candidat d'un autre CLI ne peut servir qu'à l'auto-développement.</div>
  </section>`;
}

  if(!SET.devices)SET.devices=await api('/api/audio/devices').catch(e=>({ok:false,error:e.message,inputs:[],outputs:[]}));
  const d=SET.devices,a=SET.draft.audio;
  const failure=d.ok===false?`<div class="notice bad">${esc(d.error||'Périphériques audio indisponibles.')}</div>`:'';
  return `<section>${failure}<h3>Audio</h3>
    <div class="field"><label for="f_in">Entrée microphone</label><select id="f_in" data-audio="input_device">${deviceOptions(d.inputs||[],a.input_device,(d.defaults||{}).input)}</select></div>
    <div class="field"><label for="f_out">Sortie haut-parleur</label><select id="f_out" data-audio="output_device">${deviceOptions(d.outputs||[],a.output_device,(d.defaults||{}).output)}</select></div>
    <div class="row" style="margin-bottom:8px"><button class="action" id="testAudio">Tester micro + sortie</button></div>
    <div class="test-result" id="audioTestResult">Le test enregistre 2 secondes au format de la pile vocale active, puis les rejoue.</div>
    <h3>Session</h3>
    <div class="field"><label for="f_timeout">Délai d'inactivité avant mise en veille (secondes)</label>
      <input type="number" min="0" id="f_timeout" data-audio="active_timeout_s" value="${esc(a.active_timeout_s)}">
      <div class="hint">Passé ce délai sans échange utile, JARVIS repasse en arrière-plan et rend le micro. 0 = jamais : seule la touche de réveil (F9 par défaut) ou « Jarvis mute » met fin à la conversation. Sinon, 5 s minimum.</div></div>
  </section>`;
}

/* --- onglet API Keys ---------------------------------------------------- */
function tabKeys(){
  const state=SET.data.credentials,items=state.credentials||[];
  const providerOptions=state.providers.map(p=>`<option value="${esc(p.id)}">${esc(p.label)}</option>`).join('');
  const rows=items.length?items.map(c=>{
    const provider=state.providers.find(p=>p.id===c.provider)||{label:c.provider};
    return `<tr>
      <td><input type="radio" name="bind_${esc(c.provider)}" data-bind-provider="${esc(c.provider)}" data-bind-id="${esc(c.id)}" ${c.bound?'checked':''} title="Utiliser cette clé pour ${esc(provider.label)}"></td>
      <td>${esc(provider.label)}</td><td>${esc(c.name)}</td><td class="hint">${esc(c.hint)}</td>
      <td><button class="linkish" data-delete-key="${esc(c.id)}">supprimer</button></td></tr>`}).join('')
    :'<tr><td colspan="5" class="hint" style="padding:18px 0">Aucune clé enregistrée. Les clés du fichier .env restent utilisées en secours.</td></tr>';
  const envRows=Object.entries(state.environment||{}).filter(([,names])=>names.length)
    .map(([provider,names])=>`<li>${esc(provider)} — ${names.map(esc).join(', ')}</li>`).join('');
  return `<section><h3>Clés enregistrées</h3>
    <table class="keys"><thead><tr><th style="width:34px">Active</th><th>Fournisseur</th><th>Nom</th><th>Valeur</th><th></th></tr></thead><tbody>${rows}</tbody></table>
    <div class="hint" style="margin-top:10px">Le bouton de la colonne « Active » désigne la clé qu'utilisent les services de ce fournisseur. Les valeurs ne sont jamais renvoyées à cette page : seuls les quatre derniers caractères sont affichés.</div>
    <h3>Ajouter une clé</h3>
    <form class="keyform" id="keyForm">
      <div class="field"><label for="k_provider">Type</label><select id="k_provider" name="provider">${providerOptions}</select></div>
      <div class="field"><label for="k_name">Nom</label><input id="k_name" name="name" placeholder="Perso, Travail…" autocomplete="off"></div>
      <div class="field"><label for="k_value">Valeur</label><input id="k_value" name="value" type="password" placeholder="collez la clé" autocomplete="off"></div>
      <button class="action primary" type="submit">Ajouter</button>
    </form>
    <div class="hint" id="keyHint" style="margin-top:10px"></div>
    ${envRows?`<h3>Détectées dans l'environnement</h3><ul class="hint" style="padding-left:18px">${envRows}</ul>
    <div class="hint">Utilisées uniquement si aucune clé enregistrée ne couvre le fournisseur.</div>`:''}
  </section>`;
}

/* --- onglet Raccourcis --------------------------------------------------- */
const GLOBAL_KEY_NAMES={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',PageUp:'page_up',PageDown:'page_down',Home:'home',End:'end',Insert:'insert',Delete:'delete',Pause:'pause',ScrollLock:'scroll_lock',ContextMenu:'menu',PrintScreen:'print_screen'};
function tabShortcuts(){
  const list=SET.shortcuts.shortcuts||[];
  const rows=list.map(s=>`<div class="shortcut">
      <div><div>${esc(s.label)} <span class="tag">${s.scope==='global'?'système':'interface'}</span></div><div class="desc">${esc(s.description)}</div></div>
      <button class="keycap" data-shortcut="${esc(s.id)}" data-scope="${esc(s.scope)}">${esc(s.value)}</button>
    </div>`).join('');
  return `<section><h3>Raccourcis</h3>
    <div class="hint" style="margin-bottom:14px">Cliquez sur une touche puis appuyez sur la combinaison voulue. Les raccourcis <em>système</em> sont captés même quand JARVIS n'a pas le focus, et n'acceptent qu'une touche seule. Les raccourcis <em>interface</em> ne s'appliquent que sur cette page et ignorent la saisie dans un champ.</div>
    ${rows}<div class="hint" id="shortcutHint" style="margin-top:14px">Enregistrement immédiat. Le raccourci système prend effet au prochain redémarrage du runtime Voice.</div></section>`;
}

/* --- rendu et liaisons --------------------------------------------------- */
function renderTabs(){
  $('#modalTabs').innerHTML=TABS.map(t=>`<button data-tab="${t.id}" class="${t.id===SET.tab?'active':''}">${esc(t.label)}</button>`).join('');
  document.querySelectorAll('#modalTabs button').forEach(b=>b.addEventListener('click',()=>selectTab(b.dataset.tab)));
}

async function renderTab(){
  const revision=SET.renderRevision=(SET.renderRevision||0)+1;
  modalContent.innerHTML='<div class="empty">Chargement…</div>';
  const tab=TABS.find(t=>t.id===SET.tab);
  modalSave.style.display=tab.save?'':'none';
  modalSub.textContent=tab.save?'Les réglages vocaux sont préparés pour la prochaine activation.':'Les modifications de cet onglet sont enregistrées immédiatement.';
  try{
    let content;
    if(SET.tab==='voice')content=await tabVoice();
    else if(SET.tab==='prompts')content=await tabPrompts();
    else if(SET.tab==='cli')content=await tabCli();
    else if(SET.tab==='routing')content=await tabRouting();
    else if(SET.tab==='config')content=await tabConfig();
    else if(SET.tab==='keys')content=tabKeys();
    else content=tabShortcuts();
    if(revision!==SET.renderRevision)return;
    modalContent.innerHTML=content;
  }catch(e){if(revision===SET.renderRevision)modalContent.innerHTML=`<div class="notice bad">${esc(e.message)}</div>`;return}
  bindTab();
  if(SET.dirty&&tab.save)say('Modifications non enregistrées.','');
}

function bindTab(){
  modalContent.querySelectorAll('[data-voice-architecture]').forEach(el=>el.addEventListener('change',()=>{
    voiceArchitectureChanged('architecture',el.value);renderTab()}));
  modalContent.querySelectorAll('[data-architecture-activate]').forEach(el=>el.addEventListener('click',()=>{
    voiceArchitectureChanged('architecture',voiceArchitectureConfig().architecture);renderTab()}));
  modalContent.querySelectorAll('[data-architecture-field]').forEach(el=>el.addEventListener('change',()=>{
    const value=el.dataset.architectureKind==='model'?JSON.parse(el.value):el.type==='checkbox'?el.checked:el.type==='number'?Number(el.value):el.value;
    voiceArchitectureChanged(el.dataset.architectureField,value);renderTab()}));
  modalContent.querySelectorAll('input[name=voicestack]').forEach(el=>el.addEventListener('change',()=>{
    SET.draft.voice.stack=el.value;SET.dirty=true;renderTab()}));
  modalContent.querySelectorAll('[data-voice-arch]').forEach(el=>el.addEventListener('change',()=>{
    SET.draft.voice.arch=el.value;SET.dirty=true;renderTab()}));
  modalContent.querySelectorAll('input[name=clicagent]').forEach(el=>el.addEventListener('change',()=>{
    SET.draft.cli.agent=el.value;SET.dirty=true;renderTab()}));
  modalContent.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('change',()=>{
    if(el.dataset.scope===AUTH_SCOPE){authFieldChanged(el);return}
    const values=SET.draft.voice.settings[el.dataset.scope];
    values[el.dataset.field]=el.type==='checkbox'?el.checked:(el.type==='number'?Number(el.value):el.value);
    SET.dirty=true;
    // Un champ dont d'autres dépendent (le mode de tour) fait apparaître ou
    // disparaître les réglages de détection de silence : il faut redessiner.
    const spec=SET.data.voice.stacks.find(s=>s.id===el.dataset.scope);
    if(spec&&spec.fields.some(f=>f.depends_on===el.dataset.field))renderTab();else say('Modifications non enregistrées.','');
  }));
  const advanced=$('#authAdvanced');
  if(advanced)advanced.addEventListener('toggle',()=>{SET.rdOpen=advanced.open});
  // Relire l'état sans perdre les modifications en cours (le brouillon reste).
  const authRefresh=$('#authRefresh');
  if(authRefresh)authRefresh.addEventListener('click',async()=>{
    authRefresh.textContent='…';
    try{SET.data=await api('/api/settings')}catch(e){say(e.message,'error')}
    renderTab()});
  modalContent.querySelectorAll('[data-cli-field]').forEach(el=>el.addEventListener('change',()=>{
    SET.draft.cli.settings[el.dataset.scope][el.dataset.cliField]=el.value;SET.dirty=true;say('Modifications non enregistrées.','')}));
  modalContent.querySelectorAll('[data-audio]').forEach(el=>el.addEventListener('change',()=>{
    SET.draft.audio[el.dataset.audio]=el.value;SET.dirty=true;say('Modifications non enregistrées.','')}));
  modalContent.querySelectorAll('[data-refresh]').forEach(el=>el.addEventListener('click',async()=>{
    const [provider,role]=el.dataset.refresh.split(':');el.textContent='…';
    await catalog(provider,role,true);renderTab()}));

  // Aiguillage : cocher ajoute le candidat en fin de liste (donc en dernier
  // recours), décocher le retire. L'ordre reste celui des ajouts.
  const routingOn=modalContent.querySelector('[data-routing-enabled]');
  if(routingOn)routingOn.addEventListener('change',()=>{
    SET.draft.routing.enabled=routingOn.checked;SET.dirty=true;renderTab()});
  modalContent.querySelectorAll('[data-routing-candidate]').forEach(el=>el.addEventListener('change',()=>{
    const entry=SET.draft.routing.profiles[el.dataset.routingProfile];
    const value=JSON.parse(el.dataset.routingCandidate);
    const rest=(entry.candidates||[]).filter(c=>candidateKey(c)!==el.dataset.routingCandidate);
    entry.candidates=el.checked?[...rest,value]:rest;
    SET.dirty=true;renderTab()}));
  modalContent.querySelectorAll('[data-routing-fallback]').forEach(el=>el.addEventListener('change',()=>{
    SET.draft.routing.profiles[el.dataset.routingFallback].allow_general_fallback=el.checked;
    SET.dirty=true;say('Modifications non enregistrées.','')}));
  const routingRefresh=$('#routingRefresh');
  if(routingRefresh)routingRefresh.addEventListener('click',async()=>{
    routingRefresh.textContent='…';SET.routing=null;SET.catalog={};renderTab()});

  const reprobe=$('#reprobe');
  if(reprobe)reprobe.addEventListener('click',async()=>{
    reprobe.textContent='…';
    try{await saveDraft({silent:true})}catch(e){say(e.message,'error');return}
    SET.clis=null;renderTab()});

  const test=$('#testAudio');
  if(test)test.addEventListener('click',runAudioTest);

  const form=$('#keyForm');
  if(form)form.addEventListener('submit',addCredential);
  modalContent.querySelectorAll('[data-delete-key]').forEach(el=>el.addEventListener('click',()=>deleteCredential(el.dataset.deleteKey)));
  modalContent.querySelectorAll('[data-bind-provider]').forEach(el=>el.addEventListener('change',()=>bindCredential(el.dataset.bindProvider,el.dataset.bindId)));
  modalContent.querySelectorAll('[data-shortcut]').forEach(el=>el.addEventListener('click',()=>startCapture(el)));
  modalContent.querySelectorAll('[data-prompt-save]').forEach(el=>el.addEventListener('click',()=>savePromptLayer(el)));
  modalContent.querySelectorAll('[data-prompt-reset]').forEach(el=>el.addEventListener('click',()=>resetPromptLayer(el)));
}

async function savePromptLayer(button){
  const id=button.dataset.promptSave,area=modalContent.querySelector(`[data-prompt-text="${CSS.escape(id)}"]`);
  if(!area)return;
  button.disabled=true;say('Enregistrement de la couche…','');
  try{
    const result=await api(`/api/prompts/${encodeURIComponent(id)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      action:'edit',text:area.value,base_revision:button.dataset.baseRevision,expected_effective_revision:button.dataset.effectiveRevision})});
    SET.prompts=result.prompts;SET.restartNotice=true;say('Couche enregistrée. Application au prochain démarrage ou envoi concerné.','ok');await renderTab();
  }catch(e){say(e.message,'error');button.disabled=false}
}

async function resetPromptLayer(button){
  const id=button.dataset.promptReset;
  button.disabled=true;say('Réinitialisation de la couche…','');
  try{
    const result=await api(`/api/prompts/${encodeURIComponent(id)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'reset'})});
    SET.prompts=result.prompts;SET.restartNotice=true;say('Couche revenue au défaut.','ok');await renderTab();
  }catch(e){say(e.message,'error');button.disabled=false}
}

/* Texte brut : vide = revenir au défaut, et c'est le serveur qui valide. */
function authFieldChanged(el){
  const a=SET.data.voice.authorization||{},key=el.dataset.field;
  // Changer de mode ne remet la vérification au défaut du mode que si la
  // valeur enregistrée devient incohérente (solo_owner + shadow…) : une
  // observation enregistrée survit à open_room → solo_owner → open_room.
  const stored={...(a.stored||{}),...((a.verifier_settings||{}).stored||{})};
  SET.draft.voice.authorization=authDraftAfterChange(
    SET.draft.voice.authorization,key,el.value,stored,a.verification_modes_by_mode);
  SET.dirty=true;
  if(key==='conversation_mode'){renderTab();return}
  say('Modifications non enregistrées.','');
}

function selectTab(id){SET.tab=id;renderTabs();renderTab()}

async function runAudioTest(){
  const test=$('#testAudio'),result=$('#audioTestResult'),a=SET.draft.audio;
  test.disabled=true;result.className='test-result';result.textContent='Parlez maintenant pendant 2 secondes…';
  try{
    const r=await api('/api/audio/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({input_device:a.input_device,output_device:a.output_device})});
    await saveDraft({silent:true});
    result.className='test-result ok';
    result.textContent=`Test réussi · pic ${r.peak_dbfs} dBFS · enregistrement rejoué et sélection enregistrée.`;
  }catch(e){result.className='test-result error';result.textContent=e.message}
  finally{test.disabled=false}
}

async function addCredential(event){
  event.preventDefault();
  const form=event.target,hint=$('#keyHint');
  const payload={provider:form.provider.value,name:form.name.value,value:form.value.value};
  hint.textContent='Enregistrement…';
  try{
    const r=await api('/api/credentials',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    SET.data.credentials={providers:r.providers,credentials:r.credentials,bindings:r.bindings,environment:r.environment};
    SET.catalog={};  // Une nouvelle clé peut ouvrir un catalogue jusque-là vide.
    renderTab();
  }catch(e){hint.textContent=e.message}
}

async function deleteCredential(id){
  try{
    const r=await api('/api/credentials/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
    SET.data.credentials={providers:r.providers,credentials:r.credentials,bindings:r.bindings,environment:r.environment};
    SET.catalog={};renderTab();
  }catch(e){$('#keyHint').textContent=e.message}
}

async function bindCredential(provider,id){
  try{
    const r=await api('/api/credentials/bind',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider,id})});
    SET.data.credentials={providers:r.providers,credentials:r.credentials,bindings:r.bindings,environment:r.environment};
    SET.catalog={};renderTab();
  }catch(e){$('#keyHint').textContent=e.message}
}

/* Capture d'un raccourci : on lit la prochaine frappe au lieu de demander à
   l'utilisateur d'écrire « ctrl+ArrowRight » à la main. */
function startCapture(button){
  if(SET.capture)SET.capture.cancel();
  const previous=button.textContent;
  button.classList.add('capturing');button.textContent='appuyez…';
  const hint=$('#shortcutHint');hint.textContent='Échap pour annuler.';
  const onKey=async event=>{
    event.preventDefault();event.stopPropagation();
    if(['Control','Alt','Shift','Meta'].includes(event.key))return;
    cleanup();
    if(event.key==='Escape'){button.textContent=previous;hint.textContent='Capture annulée.';return}
    const value=button.dataset.scope==='global'?globalKey(event):uiKey(event);
    if(!value){button.textContent=previous;hint.textContent='Un raccourci système JARVIS doit être une touche seule (F1…F20, Début, Suppr…), sans modificateur.';return}
    hint.textContent='Enregistrement…';
    try{
      const r=await api('/api/shortcuts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({shortcuts:{[button.dataset.shortcut]:value}})});
      SET.shortcuts=r;renderTab();$('#shortcutHint').textContent='Raccourci enregistré.';
    }catch(e){button.textContent=previous;hint.textContent=e.message}
  };
  const cleanup=()=>{window.removeEventListener('keydown',onKey,true);button.classList.remove('capturing');SET.capture=null};
  SET.capture={cancel:()=>{cleanup();button.textContent=previous}};
  window.addEventListener('keydown',onKey,true);
}
function globalKey(event){
  if(event.ctrlKey||event.altKey||event.metaKey)return '';
  if(GLOBAL_KEY_NAMES[event.key])return GLOBAL_KEY_NAMES[event.key];
  if(/^F\d{1,2}$/.test(event.key))return event.key.toLowerCase();
  if(event.key.length===1)return event.key.toLowerCase();
  return '';
}
function uiKey(event){
  const parts=[];
  if(event.ctrlKey)parts.push('ctrl');
  if(event.altKey)parts.push('alt');
  if(event.shiftKey)parts.push('shift');
  if(event.metaKey)parts.push('meta');
  const key=event.key===' '?'Space':(event.key.length===1?event.key.toLowerCase():event.key);
  return [...parts,key].join('+');
}

/* --- ouverture, enregistrement, fermeture -------------------------------- */
function draftFrom(data){
  SET.architectureDirty=false;
  return {
    // `authorization` : seules les clés touchées, jamais la description reçue.
    voice:{stack:data.voice.stack,arch:data.voice.arch||'',settings:JSON.parse(JSON.stringify(data.voice.settings)),authorization:{}},
    cli:{agent:data.cli.agent,settings:JSON.parse(JSON.stringify(data.cli.settings))},
    // La politique complète, telle que le serveur la décrit : la page ne
    // connaît ni les profils ni les candidats, elle les reçoit.
    routing:{enabled:data.routing.enabled,profiles:JSON.parse(JSON.stringify(data.routing.policy))},
    audio:{...data.audio},
  };
}

async function openSettings(){
  overlay.classList.add('open');SET.open=true;
  // Sans modification en cours, relire : l'état de Voice (Solo Owner,
  // annulation d'écho) a pu changer depuis la dernière ouverture.
  if(!SET.data||!SET.dirty){
    modalContent.innerHTML='<div class="empty">Chargement…</div>';renderTabs();
    try{
      SET.data=await api('/api/settings');
      SET.shortcuts=SET.data.shortcuts;
      SET.draft=draftFrom(SET.data);
    }catch(e){modalContent.innerHTML=`<div class="notice bad">${esc(e.message)}</div>`;return}
  }
  renderTabs();await renderTab();
}

function closeSettings(){overlay.classList.remove('open');SET.open=false;if(SET.capture)SET.capture.cancel()}

async function saveDraft(options){
  const silent=options&&options.silent;
  if(!silent){modalSave.disabled=true;say('Enregistrement…','')}
  try{
    // Réglages lus par Voice à son démarrage seulement : on le rappellera.
    const voiceRestart=Object.keys(SET.draft.voice.authorization||{}).length>0;
    const payload=JSON.parse(JSON.stringify(SET.draft));
    if(!SET.architectureDirty)delete payload.voice.architecture;
    const data=await api('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(voiceRestart)SET.restartNotice=true;
    SET.data=data;SET.shortcuts=data.shortcuts;SET.draft=draftFrom(data);SET.dirty=false;
    // Le CLI actif a pu changer : sa détection est refaite à l'ouverture de l'onglet.
    SET.clis=null;SET.routing=null;SET.prompts=null;
    if(!silent){say('Enregistré.','ok');await renderTab()}
    return data;
  }catch(e){
    if(!silent)say(e.message,'error');
    throw e;
  }finally{modalSave.disabled=false}
}

modalSave.addEventListener('click',()=>saveDraft().catch(()=>{}));
$('#closeModal').addEventListener('click',closeSettings);
$('#openSettings').addEventListener('click',openSettings);
overlay.addEventListener('mousedown',event=>{if(event.target===overlay)closeSettings()});

/* --- raccourcis d'interface ---------------------------------------------- */
function currentSignature(event){
  const parts=[];
  if(event.ctrlKey)parts.push('ctrl');
  if(event.altKey)parts.push('alt');
  if(event.shiftKey)parts.push('shift');
  if(event.metaKey)parts.push('meta');
  const key=event.key===' '?'Space':(event.key.length===1?event.key.toLowerCase():event.key);
  return [...parts,key].join('+');
}
function typingInField(target){
  if(!target)return false;
  return target.isContentEditable||['INPUT','TEXTAREA','SELECT'].includes(target.tagName);
}
window.addEventListener('keydown',event=>{
  if(SET.capture||typingInField(event.target))return;
  const values=(SET.shortcuts&&SET.shortcuts.values)||{};
  const signature=currentSignature(event);
  const match=Object.entries(values).find(([id,value])=>id.startsWith('ui_')&&value===signature);
  if(!match)return;
  const [id]=match;
  if(id==='ui_settings'){event.preventDefault();if(!SET.open)openSettings();return}
  if(id==='ui_close'){event.preventDefault();if(SET.open)closeSettings();else closePanel();return}
  if(id==='ui_tab_next'||id==='ui_tab_prev'){
    if(!SET.open)return;
    event.preventDefault();
    const index=TABS.findIndex(t=>t.id===SET.tab),step=id==='ui_tab_next'?1:-1;
    selectTab(TABS[(index+step+TABS.length)%TABS.length].id);return;
  }
  const panelName={ui_panel_errors:'errors',ui_panel_trace:'trace',ui_panel_agents:'agents'}[id];
  if(panelName){event.preventDefault();if(current===panelName)closePanel();else{if(panelName==='errors')errorsView='active';openPanel(panelName)}}
});

document.querySelectorAll('.dock button[data-panel]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.panel==='errors')errorsView='active';if(b.dataset.panel==='agents'&&current==='agents'){showList();return}openPanel(b.dataset.panel)}));
$('#closePanel').addEventListener('click',closePanel);
// Les raccourcis d'interface doivent répondre avant même la première ouverture
// des réglages : leurs valeurs sont donc chargées au démarrage.
api('/api/shortcuts').then(value=>{SET.shortcuts=value}).catch(()=>{});
setInterval(refreshStatus,1000);setInterval(tickLive,250);refreshStatus();
</script>
