<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS</title>
<style>
:root{color-scheme:dark;--bg:#05080b;--panel:rgba(6,12,18,.94);--line:#183343;--text:#d8edf7;--muted:#7190a0;--accent:#6ee7ff;--danger:#ff6577;--ok:#68e0a0}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px ui-monospace,SFMono-Regular,Consolas,monospace;overflow:hidden;cursor:default}#app{position:relative;width:100%;height:100%}.face{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;pointer-events:none;cursor:default}.topbar{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.brand,.state,.voicehint{background:rgba(3,8,12,.72);border:1px solid rgba(110,231,255,.18);backdrop-filter:blur(10px);padding:8px 12px;letter-spacing:.14em;text-transform:uppercase}.state{font-size:12px;color:var(--muted)}.state strong{color:var(--accent)}.voicehint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:12px;color:var(--accent);pointer-events:none;box-shadow:0 0 30px rgba(0,0,0,.35)}.dock{position:absolute;right:18px;top:50%;transform:translateY(-50%);display:grid;gap:10px}.dock button{width:52px;height:52px;border:1px solid rgba(110,231,255,.26);background:rgba(3,8,12,.82);color:var(--text);border-radius:10px;cursor:pointer;font:12px inherit;backdrop-filter:blur(12px)}.dock button:hover,.dock button.active{border-color:var(--accent);color:var(--accent)}.badge{position:absolute;right:-5px;top:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:white;font-size:10px;display:none;align-items:center;justify-content:center}.tool{position:relative}.panel{position:absolute;top:18px;right:86px;bottom:18px;width:min(560px,calc(100% - 120px));background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(18px);display:none;flex-direction:column;box-shadow:0 0 50px rgba(0,0,0,.45)}.panel.open{display:flex}.panel header{display:flex;justify-content:space-between;align-items:center;padding:15px 17px;border-bottom:1px solid var(--line)}.panel header h2{font-size:14px;margin:0;letter-spacing:.12em;text-transform:uppercase}.panel header button{background:none;color:var(--muted);border:0;font-size:20px;cursor:pointer}.body{padding:16px;overflow:auto;min-height:0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.statusdot{width:9px;height:9px;border-radius:50%;background:var(--muted)}.statusdot.running{background:var(--ok)}button.action{border:1px solid var(--line);background:#0b141a;color:var(--text);padding:8px 11px;border-radius:6px;cursor:pointer}button.action:hover{border-color:var(--accent)}button.danger:hover{border-color:var(--danger);color:var(--danger)}pre.log{white-space:pre-wrap;word-break:break-word;margin:0;font-size:12px;line-height:1.55;color:#a9c5d2}.entry{padding:9px 0;border-bottom:1px solid rgba(113,144,160,.12)}.entry .meta{font-size:10px;color:var(--muted);margin-bottom:3px}.entry.error{color:#ff9eaa}.settings{display:grid;gap:13px}.settings label{display:grid;gap:5px;color:var(--muted);font-size:12px}.settings input{width:100%;background:#071015;border:1px solid var(--line);color:var(--text);padding:9px;border-radius:5px;font:inherit}.hint{font-size:11px;color:var(--muted)}textarea{width:100%;min-height:80px;background:#071015;border:1px solid var(--line);color:var(--text);padding:9px;border-radius:5px;font:inherit;resize:vertical}.agentEvents{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.empty{color:var(--muted);padding:20px 0;text-align:center}@media(max-width:700px){.panel{left:12px;right:76px;top:12px;bottom:12px;width:auto}.dock{right:10px}.topbar{left:10px;right:74px}.brand{display:none}}
</style>
</head>
<body>
<div id="app">
  <iframe class="face" src="__VISUALIZER_URL__" title="Jarvis visualizer"></iframe>
  <div class="topbar"><div class="brand">JARVIS</div><div class="state">VOICE <strong id="voiceState">IDLE</strong> · CLAUDE <strong id="agentState">STOPPED</strong></div></div>
  <div class="voicehint" id="voiceHint">F9 · DÉMARRER</div>
  <nav class="dock" aria-label="Jarvis tools">
    <div class="tool"><button data-panel="errors" title="Errors">ERR</button><span class="badge" id="errorBadge">0</span></div>
    <div class="tool"><button data-panel="trace" title="Trace">TRC</button></div>
    <div class="tool"><button data-panel="settings" title="Settings">SET</button></div>
    <div class="tool"><button data-panel="agents" title="Agents">AGT</button></div>
  </nav>
  <section class="panel" id="panel"><header><h2 id="panelTitle">Panel</h2><button id="closePanel" aria-label="Fermer">×</button></header><div class="body" id="panelBody"></div></section>
</div>
<script>
const $=s=>document.querySelector(s);let current=null;const panel=$('#panel'),body=$('#panelBody'),title=$('#panelTitle');
async function api(path,opts){const r=await fetch(path,opts);if(!r.ok)throw new Error(await r.text());return r.json()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function entries(items){if(!items.length)return '<div class="empty">Aucune entrée.</div>';return items.slice().reverse().map(x=>`<div class="entry ${x.level==='error'?'error':''}"><div class="meta">${esc(x.ts)} · ${esc(x.kind)} · ${esc(x.level)}</div><div>${esc(x.message)}</div>${x.data&&Object.keys(x.data).length?`<pre class="log">${esc(JSON.stringify(x.data,null,2))}</pre>`:''}</div>`).join('')}
async function refreshStatus(){try{const s=await api('/api/status'),v=s.voice_state||'idle',k=String(s.manual_wake_key||'f9').toUpperCase(),online=s.voice_online===true;$('#voiceState').textContent=online?v.toUpperCase():'OFFLINE';$('#voiceHint').textContent=online?({idle:`${k} · DÉMARRER`,listening:`${k} · ENVOYER`,thinking:`${k} · ANNULER`,speaking:`${k} · INTERROMPRE`}[v]||`${k} · CONTRÔLER`):`${k} · VOICE HORS LIGNE`;$('.face').style.visibility=online?'visible':'hidden';$('#agentState').textContent=(s.agent.state||'stopped').toUpperCase();const b=$('#errorBadge');b.textContent=s.error_count;b.style.display=s.error_count?'flex':'none';if(current==='agents')renderAgents(s.agent)}catch(e){$('#voiceState').textContent='OFFLINE';$('#agentState').textContent='OFFLINE';$('#voiceHint').textContent='VOICE HORS LIGNE';$('.face').style.visibility='hidden'}}
async function openPanel(name){current=name;document.querySelectorAll('.dock button').forEach(b=>b.classList.toggle('active',b.dataset.panel===name));panel.classList.add('open');title.textContent={errors:'Errors',trace:'Trace',settings:'Settings',agents:'Agents'}[name];body.innerHTML='<div class="empty">Chargement…</div>';try{if(name==='errors')body.innerHTML=entries(await api('/api/errors'));if(name==='trace')body.innerHTML=entries(await api('/api/trace'));if(name==='settings')renderSettings(await api('/api/settings'));if(name==='agents')renderAgents(await api('/api/agent'));}catch(e){body.innerHTML=`<div class="entry error">${esc(e.message)}</div>`}}
function renderSettings(s){body.innerHTML=`<form class="settings" id="settingsForm"><label>Claude CLI<input name="claude_cli" value="${esc(s.claude_cli)}"></label><label>OpenAI API key<input name="openai_api_key" type="password" placeholder="${s.openai_api_key_set?'Configured — leave blank to keep':'Not configured'}"></label><label>Porcupine access key<input name="porcupine_access_key" type="password" placeholder="${s.porcupine_access_key_set?'Configured — leave blank to keep':'Not configured'}"></label><label>Manual wake key<input name="manual_wake_key" value="${esc(s.manual_wake_key)}"></label><label>Active timeout (seconds)<input name="active_timeout_s" type="number" min="5" value="${esc(s.active_timeout_s)}"></label><div class="row"><button class="action" type="submit">Save</button></div><div class="hint">MVP: les changements Voice prennent effet au prochain restart du runtime Voice.</div></form>`;$('#settingsForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget),p=Object.fromEntries(f.entries());try{await api('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});await openPanel('settings')}catch(err){alert(err.message)}})}
function renderAgents(a){if(current!=='agents')return;const ev=(a.events||[]).slice().reverse().map(x=>`<div class="entry"><div class="meta">${esc(x.type||'event')}</div><pre class="log">${esc(JSON.stringify(x,null,2))}</pre></div>`).join('');body.innerHTML=`<div class="row"><span class="statusdot ${a.state==='running'?'running':''}"></span><strong>Claude</strong><span class="hint">${esc(a.state)}${a.pid?' · PID '+esc(a.pid):''}</span></div><div class="row" style="margin-top:12px"><button class="action" data-agent="start">Start</button><button class="action" data-agent="restart">Restart</button><button class="action danger" data-agent="kill">Kill</button></div><div style="margin-top:14px"><textarea id="agentInput" placeholder="Message direct au Claude local…"></textarea><button class="action" id="sendAgent" style="margin-top:7px">Send</button></div><div class="agentEvents">${ev||'<div class="empty">Aucun événement Claude.</div>'}</div>`;document.querySelectorAll('[data-agent]').forEach(b=>b.addEventListener('click',async()=>{await api('/api/agent/'+b.dataset.agent,{method:'POST'});await openPanel('agents')}));$('#sendAgent').addEventListener('click',async()=>{const text=$('#agentInput').value.trim();if(!text)return;await api('/api/agent/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});$('#agentInput').value='';setTimeout(()=>openPanel('agents'),300)})}
document.querySelectorAll('.dock button').forEach(b=>b.addEventListener('click',()=>openPanel(b.dataset.panel)));$('#closePanel').addEventListener('click',()=>{current=null;panel.classList.remove('open');document.querySelectorAll('.dock button').forEach(b=>b.classList.remove('active'))});setInterval(refreshStatus,1000);refreshStatus();
</script>
</body>
</html>
