<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scène Remotion</title>
<style>
:root{color-scheme:dark;--ink:#dcecf4;--muted:#8aa5b3;--edge:rgba(151,191,209,.18);--accent:#6ee7ff;--bad:#ff6b7d;--warn:#ffcf70;--surface:rgba(4,10,15,.92)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;color:var(--ink);font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#stage{position:relative;display:flex;flex-direction:column;width:100%;height:100%;min-height:0}
.rs-frame-host{position:relative;flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0;background:#000}
.rs-frame{display:block;border:0;width:100%;height:100%;background:transparent}
.rs-panel{margin:0;padding:10px 12px;border:1px solid var(--edge);border-radius:6px;background:var(--surface);max-width:46rem;overflow:auto}
.rs-panel[hidden]{display:none}
.rs-wait,.rs-failed,.rs-killed{position:absolute;inset:6px;max-height:calc(100% - 12px);z-index:2}
.rs-wait{height:fit-content}
.rs-failed,.rs-killed{border-color:rgba(255,107,125,.55);background:rgba(40,8,14,.94)}
.rs-title{margin:0 0 6px;font-weight:600;font-size:14px}
.rs-failed .rs-title,.rs-killed .rs-title{color:#ffd5db}
.rs-line{margin:0 0 6px;color:var(--ink);overflow-wrap:anywhere}
.rs-wait .rs-line{color:var(--muted)}
.rs-diag{margin:0 0 4px;padding:3px 6px;font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;background:rgba(255,255,255,.05);border-radius:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.rs-wait .rs-title::after{content:'';display:inline-block;width:.6em;height:.6em;margin-left:.6em;border-radius:50%;background:var(--accent);animation:rs-pulse 1.2s ease-in-out infinite}
@keyframes rs-pulse{0%,100%{opacity:.25}50%{opacity:1}}
.rs-btn{appearance:none;margin:2px 0 8px;padding:5px 12px;border:1px solid var(--edge);border-radius:5px;background:transparent;color:var(--ink);font:inherit;cursor:pointer}
.rs-btn:hover{background:rgba(255,255,255,.08)}
.rs-btn:focus-visible,.rs-scrub:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rs-bar{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;align-items:center;gap:10px;padding:6px 10px;background:linear-gradient(transparent,rgba(0,0,0,.72))}
.rs-bar[hidden]{display:none}
.rs-bar .rs-btn{margin:0;min-width:5.5em}
.rs-scrub{flex:1 1 auto;accent-color:var(--accent)}
.rs-sound{flex:none;font:12px system-ui,sans-serif;color:var(--muted)}
.rs-time{flex:none;font:12px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.rs-wait .rs-title::after{animation:none}}
</style>
</head>
<body>
<div id="stage"></div>
<script>/*__REMOTION_PROTOCOL_JS__*/</script>
<script>/*__REMOTION_STAGE_JS__*/</script>
<script>
(function(){
  'use strict';
  const config=__REMOTION_STAGE_CONFIG__;
  function log(level,key,data){try{console[level==='warn'?'warn':'info']('['+key+']',data)}catch(_e){}}
  function report(fields){
    return fetch('/api/remotion/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({prefab_id:config.prefabId,version:config.version},fields))})
      .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status)});
  }
  const stage=window.JarvisRemotionStage.createStage({
    document:document,window:window,parentWindow:window.parent,origin:window.location.origin,fetch:window.fetch.bind(window),
    prefabId:config.prefabId,version:config.version,iframeAttributes:config.iframeAttributes,log:log,report:report,
    now:function(){return Date.now()},setTimeout:function(f,m){return window.setTimeout(f,m)},clearTimeout:function(i){window.clearTimeout(i)},
    setInterval:function(f,m){return window.setInterval(f,m)},clearInterval:function(i){window.clearInterval(i)}
  });
  window.__remotionStage=stage;
  stage.start();
})();
</script>
</body>
</html>
