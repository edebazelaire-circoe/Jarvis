<div class="cx tl" id="tl">
  <div class="cx-ambient" aria-hidden="true"></div>
  <main class="cx-page" aria-label="Frise de la semaine">
    <header class="tl-hero cx-rise">
      <div class="tl-hero-text">
        <p class="cx-eyebrow" id="tl-range"></p>
        <h1 class="tl-title" id="tl-title">Ma semaine</h1>
      </div>
      <p class="tl-count" aria-live="polite">
        <span class="cx-big" id="tl-n" aria-hidden="true">0</span>
        <span class="cx-cap" id="tl-n-cap">événements</span>
      </p>
    </header>
    <ol class="tl-days" id="tl-days" aria-label="Jours"></ol>
    <p class="cx-cap tl-empty" id="tl-empty" hidden>Aucun événement cette semaine.</p>
  </main>
  <p class="cx-toast" id="tl-notice" role="status" aria-live="polite"></p>
</div>
