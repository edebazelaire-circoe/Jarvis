<div class="cx db" id="db">
  <div class="cx-ambient" aria-hidden="true"></div>
  <main class="cx-page" aria-label="Tableau de bord">
    <header class="db-hero cx-rise">
      <div class="db-hero-text">
        <p class="cx-eyebrow" id="db-eyebrow">Tableau de bord</p>
        <p class="db-figure"><span class="cx-display" id="db-open" aria-hidden="true">0</span><span class="db-unit">à faire</span></p>
        <p class="cx-lead db-sub" id="db-sub" role="status"></p>
      </div>
      <figure class="db-gauge" id="db-gauge" aria-hidden="true">
        <svg viewBox="0 0 120 120" class="db-ring">
          <defs>
            <linearGradient id="db-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#8be9ff"/><stop offset="1" stop-color="#aea4ff"/>
            </linearGradient>
          </defs>
          <circle class="db-ring-track" cx="60" cy="60" r="50"/>
          <circle class="db-ring-fill" id="db-ring" stroke="url(#db-grad)" cx="60" cy="60" r="50" pathLength="100"/>
        </svg>
        <figcaption class="db-gauge-in"><span class="cx-big" id="db-pct">0</span><span class="cx-cap">% fait</span></figcaption>
      </figure>
    </header>
    <nav class="db-chips cx-rise" id="db-chips" aria-label="Aller à une section" style="--i:2"></nav>
    <div class="db-sections" id="db-sections"></div>
    <p class="cx-cap db-empty" id="db-empty" hidden>Aucune section.</p>
  </main>
  <p class="cx-toast" id="db-notice" role="status" aria-live="polite"></p>
</div>
