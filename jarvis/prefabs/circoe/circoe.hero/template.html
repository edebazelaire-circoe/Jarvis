<div class="cx hr" id="hr" data-align="left">
  <div class="cx-ambient" aria-hidden="true"></div>
  <main class="cx-page" aria-label="Annonce">
    <header class="hr-head">
      <p class="cx-eyebrow cx-rise" id="hr-eyebrow"></p>
      <h1 class="hr-title cx-rise" id="hr-title" style="--i:1"></h1>
      <p class="cx-lead hr-lead cx-rise" id="hr-lead" style="--i:2"></p>
    </header>
    <section class="hr-metric cx-glass cx-rise" id="hr-metric" style="--i:3">
      <div class="hr-glow" aria-hidden="true"></div>
      <svg class="hr-arc" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <linearGradient id="hr-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <circle cx="100" cy="100" r="96" fill="none" stroke="url(#hr-grad)" stroke-width=".6"/>
        <circle cx="100" cy="100" r="74" fill="none" stroke="url(#hr-grad)" stroke-width=".6"/>
      </svg>
      <p class="hr-figure"><span class="hr-value" id="hr-value" aria-hidden="true">0</span><span class="hr-unit" id="hr-unit"></span></p>
      <div class="hr-under">
        <p class="hr-label" id="hr-label"></p>
        <p class="cx-pill hr-delta" id="hr-delta" hidden><svg class="cx-ico" viewBox="0 0 24 24" aria-hidden="true"><path id="hr-trend" d="M6 14l6-6 6 6"/></svg><span class="cx-num" id="hr-delta-t"></span></p>
      </div>
    </section>
    <ul class="hr-bullets" id="hr-bullets"></ul>
    <hr class="cx-rule hr-rule" id="hr-rule">
    <dl class="hr-stats" id="hr-stats"></dl>
    <p class="hr-cta cx-rise" id="hr-cta" hidden style="--i:6"><button type="button" class="cx-btn cx-btn-primary" id="hr-action"><span id="hr-action-t"></span><svg class="cx-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M8.5 7H17v8.5"/></svg></button></p>
  </main>
  <p class="cx-toast" id="hr-notice" role="status" aria-live="polite"></p>
</div>
