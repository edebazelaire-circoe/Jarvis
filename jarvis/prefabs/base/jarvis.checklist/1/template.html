<main class="ck" id="ck">
  <div class="ck-progress" id="ck-progress" hidden>
    <div class="ck-track" id="ck-track" role="progressbar" aria-label="Progression" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"><span class="ck-fill" id="ck-fill"></span></div>
    <span class="jv-num ck-count" id="ck-count"></span>
  </div>
  <div class="ck-list" id="ck-list" role="group" aria-label="Liste de contrôle"></div>
  <p class="jv-muted ck-empty" id="ck-empty" hidden>Aucun élément.</p>
  <p class="ck-notice" id="ck-notice" role="status" aria-live="polite"></p>
</main>
