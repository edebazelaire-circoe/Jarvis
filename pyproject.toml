[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-local-v1"
version = "0.2.0"
description = "Persistent local Jarvis assistant with separate Core and Voice runtimes"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "aiohttp>=3.11,<4",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
voice = [
  "numpy>=2.0,<3",
  "sounddevice>=0.5,<1",
  "pynput>=1.7,<2",
  "pvporcupine>=3,<4",
  # Annulation d'écho WebRTC (AEC3) du mode continu, roue précompilée.
  # Facultative : sans elle, la garde d'écho seule protège le micro.
  "livekit>=1.1,<2",
]
# Vérification du locuteur locale (Solo Owner, moteur de référence de la
# tâche 03, pas le choix définitif). Apache-2.0 ; le modèle se télécharge à part
# (`jarvis owner-voice download-model`). Facultative : sans elle, rien n'est
# vérifié et Solo Owner est refusé.
speaker = [
  "numpy>=2.0,<3",
  "sherpa-onnx>=1.13.8,<2",
]
calendar-google = [
  "google-api-python-client>=2,<3",
  "google-auth>=2,<3",
  "google-auth-oauthlib>=1,<2",
]
drive-google = [
  "google-api-python-client>=2,<3",
  "google-auth>=2,<3",
  "google-auth-oauthlib>=1,<2",
]
mcp = [
  "mcp>=1.2,<2",
]
dev = [
  "numpy>=2.0,<3",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]

[project.scripts]
jarvis = "jarvis.app:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
