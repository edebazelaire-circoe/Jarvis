[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-local-v1"
version = "0.2.0"
description = "Persistent local Jarvis assistant with separate Core and Voice runtimes"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "aiohttp>=3.11,<4",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
voice = [
  "numpy>=2.0,<3",
  "sounddevice>=0.5,<1",
  "pynput>=1.7,<2",
  "pvporcupine>=3,<4",
]
calendar-google = [
  "google-api-python-client>=2,<3",
  "google-auth>=2,<3",
  "google-auth-oauthlib>=1,<2",
]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]

[project.scripts]
jarvis = "jarvis.app:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
